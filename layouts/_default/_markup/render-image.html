{{ if .Title }}
  <figure>
    <a class="zoom" href="{{ .Destination | safeURL }}"><img src="{{ .Destination | safeURL }}" alt="{{ .Text }}" loading="lazy"></a>
    <figcaption>{{ .Title }}</figcaption>
  </figure>
{{ else }}
  <a class="zoom" href="{{ .Destination | safeURL }}"><img src="{{ .Destination | safeURL }}" alt="{{ .Text }}" loading="lazy"></a>
{{ end }}
