# Configuration for scripts/sync_notes.py
# Vault is read-only. Override the path with WEBSITE_VAULT.

[vault]
path = "/home/anish/Documents/Anish Goyal's Vault"
image_dirs = ["97. Attachments/Images"]
excalidraw_dirs = ["97. Attachments/Excalidraw"]
# Directories scanned for links to published notes (equation numbering counts
# references vault-wide, like math-booster does). Relative to the vault.
scan_dirs = ["00. Home", "01. Periodic", "02. Projects", "03. References", "04. Notes", "05. Clippings"]

[exclude]
frontmatter_keys = ["excalidraw-plugin"]
# Applied only to filenames without a leading ordinal.
filename_patterns = ['^(HW|Homework|Quiz|Test|Exam)\b', '\b(HW|Quiz|Practice|Work)$', '^goyal', '^Week \d+']

# Images that replace a vault image on the site only (vault stays untouched).
# key: vault basename as embedded in the note; value: file under scripts/overrides/img/
[image_overrides]
"Perpetuity example probelm.png" = "perpetuity example problem.png"

[groups]
order = ["Mathematics", "Electrical Engineering", "Physics", "Self-study"]

[parity]
# math-booster (LaTeX-like Theorem & Equation Referencer v2.2.0) profile "English"
strip_leading_zeros = false
proof_end = ""
number_examples = true
equation_numbers_only_when_referenced = true
cross_note_prefix = " > "
lightbox = true
hover_zoom = true
# `[!theorem|*]` in math-booster means "unnumbered"; a callout becomes the note's
# main theorem only with a `%% main %%` comment. Set true to treat `|*` as main.
star_marks_main = false

